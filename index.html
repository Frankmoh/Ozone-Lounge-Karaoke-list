<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozone Lounge | Exclusive Karaoke Collection</title>
  <meta name="description" content="Ozone Lounge Lavington Premium Karaoke List">
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- RemixIcons for toggle and scroll to top -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      /* Dark Theme - Ultimate Premium */
      --bg-gradient: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%);
      --surface-bg: rgba(20, 20, 20, 0.7);
      --surface-border: rgba(212, 175, 55, 0.15);
      --text-primary: #FFFFFF;
      --text-secondary: #E0E0E0;
      --text-muted: #A0A0A0;
      --accent-gold: #D4AF37;
      --accent-glow: rgba(212, 175, 55, 0.4);
      --hover-bg: rgba(212, 175, 55, 0.08);
      --glass-blur: blur(16px);
      
      --font-display: 'Playfair Display', serif;
      --font-ui: 'Outfit', sans-serif;
    }

    [data-theme="light"] {
      /* Light Theme - Clean Premium */
      --bg-gradient: radial-gradient(circle at top, #ffffff 0%, #f0f2f5 100%);
      --surface-bg: rgba(255, 255, 255, 0.8);
      --surface-border: rgba(184, 134, 11, 0.2);
      --text-primary: #111111;
      --text-secondary: #333333;
      --text-muted: #666666;
      --accent-gold: #B8860B;
      --accent-glow: rgba(184, 134, 11, 0.3);
      --hover-bg: rgba(184, 134, 11, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: var(--font-ui);
      transition: all 0.5s ease;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
      opacity: 0.5;
      z-index: -1;
      pointer-events: none;
      filter: blur(80px);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 5%;
    }

    /* Navbar / Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      position: sticky;
      top: 0;
      background: var(--surface-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--surface-border);
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 3rem;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      height: 60px; /* Adjust based on logo proportions */
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .subtitle {
      color: var(--accent-gold);
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.1rem;
      letter-spacing: 2px;
      margin-top: -5px;
    }

    /* Theme Toggle */
    .theme-toggle {
      background: transparent;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .theme-toggle::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--accent-gold);
      transform: scale(0);
      transition: transform 0.4s ease;
      border-radius: 50%;
      z-index: -1;
    }

    .theme-toggle:hover::before {
      transform: scale(1);
    }

    .theme-toggle:hover {
      color: var(--bg-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Controls (Search & Filter) */
    .controls {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 2rem;
      flex-direction: row;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .search-box { flex: 1; min-width: 0; }
    .category-box { width: 110px; flex-shrink: 0; }

    @media (min-width: 768px) {
      .controls { gap: 1.5rem; }
      .category-box { width: 220px; }
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      right: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent-gold);
      font-size: 1.2rem;
    }

    input, select {
      width: 100%;
      padding: 0.8rem 1rem;
      background-color: var(--surface-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--surface-border);
      color: var(--text-primary);
      border-radius: 12px;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 500;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    
    input {
      padding-right: 2.5rem;
    }
    
    select {
      padding-left: 0.6rem;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23D4AF37%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 0.6rem top 50%;
      background-size: 0.7rem auto;
    }

    option {
      background-color: #1a1a1a;
      color: #ffffff;
    }

    [data-theme="light"] option {
      background-color: #ffffff;
      color: #111111;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus, select:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 20px var(--accent-glow);
      background-color: var(--hover-bg);
    }

    /* Table Styles */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      background-color: var(--surface-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    /* Custom Scrollbar for the table */
    .table-responsive::-webkit-scrollbar {
      height: 8px;
    }
    .table-responsive::-webkit-scrollbar-track {
      background: var(--surface-bg); 
    }
    .table-responsive::-webkit-scrollbar-thumb {
      background: var(--accent-gold); 
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 505px;
      table-layout: fixed;
    }

    th, td {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--surface-border);
      vertical-align: middle;
      white-space: normal;
      word-wrap: break-word;
    }

    /* Fixed widths to keep Song and Artist in view, forcing Category to overflow horizontally on small screens */
    th:nth-child(1), td:nth-child(1) { width: 45px; }
    th:nth-child(2), td:nth-child(2) { width: 180px; }
    th:nth-child(3), td:nth-child(3) { width: 140px; }
    th:nth-child(4), td:nth-child(4) { width: 140px; }

    th {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      position: sticky;
      top: 0;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(5px);
      z-index: 10;
    }
    
    [data-theme="light"] th {
      background: rgba(255,255,255,0.95);
    }

    tr {
      transition: all 0.3s ease;
    }

    tr:hover {
      background-color: var(--hover-bg);
      transform: scale(1.002);
    }
    
    tr:hover td:first-child {
      border-left: 3px solid var(--accent-gold);
    }
    
    td:first-child {
      border-left: 3px solid transparent;
      transition: border-left 0.3s ease;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .number-col {
      color: var(--accent-gold);
      font-weight: 300;
      font-size: 0.9rem;
    }

    .song-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-primary);
      font-family: var(--font-display);
      letter-spacing: 0.5px;
    }

    .song-artist {
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 300;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .song-artist i {
      color: var(--accent-gold);
      font-size: 0.9rem;
    }

    .category-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      background-color: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--accent-gold);
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.05);
    }

    .no-results {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-muted);
      font-size: 1.5rem;
      font-family: var(--font-display);
      font-style: italic;
    }

    /* Scroll to top button */
    .scroll-top {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 55px;
      height: 55px;
      background: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transform: translateY(30px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .scroll-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .scroll-top:hover {
      transform: translateY(-8px) scale(1.05);
      background: #FFF;
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.3);
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 5rem;
      padding: 3rem 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    
    footer span {
      color: var(--accent-gold);
    }

    /* Animations */
    @keyframes fadeInRow {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile Optimizations */
    @media (max-width: 600px) {
      header { padding: 1rem 5%; margin-bottom: 1.5rem; }
      .logo { height: 40px; }
      .container { padding: 0 3%; }
      .song-title { font-size: 0.95rem; }
      .song-artist { font-size: 0.8rem; }
      .category-badge { font-size: 0.65rem; padding: 0.3rem 0.6rem; }
      .scroll-top {
        bottom: 20px;
        left: 20px;
        width: 45px;
        height: 45px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo-container">
      <img src="logo.png" alt="Ozone Lounge Logo" class="logo">
      <p class="subtitle">Premium Karaoke</p>
    </div>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
      <i class="ri-sun-fill" id="themeIcon"></i>
    </button>
  </header>

  <div class="container">
    <main>
      <div class="controls">
        <div class="search-box input-wrapper">
          <i class="ri-search-line"></i>
          <input type="text" id="searchInput" placeholder="Search by song title or artist...">
        </div>
        <div class="category-box">
          <select id="categorySelect">
            <option value="">All Genres</option>
            <option value="RHYTHM AND BLUES">Rhythm & Blues</option>
            <option value="70'S">70's Classics</option>
            <option value="80'S">80's Hits</option>
            <option value="90'S">90's Anthems</option>
            <option value="KENYAN/AFRICAN">Kenyan & African</option>
            <option value="REGGAE">Reggae</option>
            <option value="POP AND ROCK">Pop & Rock</option>
            <option value="HIP HOP">Hip Hop</option>
            <option value="DANCE">Dance</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table id="songsTable">
          <thead>
            <tr>
              <th class="number-col">No.</th>
              <th>Song Title</th>
              <th>Artist</th>
              <th>Genre</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
        <div id="noResults" class="no-results" style="display: none;">
          No exclusive tracks found matching your search.
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; 2024 <span>Ozone Lounge</span> Lavington. All Rights Reserved.</p>
    </footer>
  </div>

  <button id="scrollTopBtn" class="scroll-top" aria-label="Scroll to top">
    <i class="ri-arrow-up-s-line"></i>
  </button>

  <script src="songs.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Elements
      const tableBody = document.getElementById('tableBody');
      const searchInput = document.getElementById('searchInput');
      const categorySelect = document.getElementById('categorySelect');
      const noResults = document.getElementById('noResults');
      const songsTable = document.getElementById('songsTable');
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const scrollTopBtn = document.getElementById('scrollTopBtn');

      // Theme logic
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);

      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
      });

      function updateThemeIcon(theme) {
        if (theme === 'dark') {
          themeIcon.className = 'ri-sun-fill'; // Show sun to toggle to light
        } else {
          themeIcon.className = 'ri-moon-fill'; // Show moon to toggle to dark
        }
      }

      // Scroll to Top Logic
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          scrollTopBtn.classList.add('visible');
        } else {
          scrollTopBtn.classList.remove('visible');
        }
      });

      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });

      // Rendering logic
      function renderTable(data) {
        tableBody.innerHTML = '';
        
        if (data.length === 0) {
          songsTable.style.display = 'none';
          noResults.style.display = 'block';
          return;
        }

        songsTable.style.display = 'table';
        noResults.style.display = 'none';

        const fragment = document.createDocumentFragment();
        
        // Add staggered animation to first few rows
        data.slice(0, 50).forEach((song, index) => {
          const row = document.createElement('tr');
          row.style.animation = `fadeInRow 0.4s ease forwards ${index * 0.02}s`;
          row.style.opacity = '0'; // Initial state for animation
          
          row.innerHTML = `
            <td class="number-col">${song.number}</td>
            <td class="song-title">${song.title}</td>
            <td class="song-artist"><i class="ri-mic-line"></i> ${song.artist}</td>
            <td><span class="category-badge">${song.category}</span></td>
          `;
          
          fragment.appendChild(row);
        });

        // For the rest, append without staggered animation to save performance
        if(data.length > 50) {
           data.slice(50).forEach(song => {
            const row = document.createElement('tr');
            row.style.opacity = '1';
            
            row.innerHTML = `
              <td class="number-col">${song.number}</td>
              <td class="song-title">${song.title}</td>
              <td class="song-artist"><i class="ri-mic-line"></i> ${song.artist}</td>
              <td><span class="category-badge">${song.category}</span></td>
            `;
            
            fragment.appendChild(row);
          });
        }
        
        tableBody.appendChild(fragment);
      }

      function filterSongs() {
        const searchTerm = searchInput.value.toLowerCase();
        const category = categorySelect.value;
        
        const filtered = songs.filter(song => {
          const matchesSearch = song.title.toLowerCase().includes(searchTerm) || 
                                song.artist.toLowerCase().includes(searchTerm) ||
                                song.number.toString().includes(searchTerm);
          const matchesCategory = category === '' || song.category === category;
          
          return matchesSearch && matchesCategory;
        });
        
        renderTable(filtered);
      }

      // Init table
      if (typeof songs !== 'undefined') {
        renderTable(songs);
      } else {
        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 30px; color: #ff3366; font-family: var(--font-display); font-size: 1.2rem;">Error loading the exclusive tracks data.</td></tr>';
      }

      // Listeners
      searchInput.addEventListener('input', filterSongs);
      categorySelect.addEventListener('change', filterSongs);
    });
  </script>
</body>
</html>
