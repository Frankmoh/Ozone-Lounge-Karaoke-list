<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate To-Do List App</title>
    <link rel="stylesheet" href="todo-styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>✓ My Tasks</h1>
                <p class="header-subtitle">Stay organized and productive</p>
            </div>
            <div class="header-actions">
                <button class="btn-theme" id="themeToggle" title="Toggle Dark Mode">🌙</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="todoInput" 
                        class="todo-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button class="btn-add" id="addBtn" title="Add Task">
                        <span class="plus-icon">+</span>
                    </button>
                </div>
                <div class="quick-add-buttons">
                    <button class="quick-btn" data-priority="high">🔴 High</button>
                    <button class="quick-btn" data-priority="medium">🟡 Medium</button>
                    <button class="quick-btn" data-priority="low">🟢 Low</button>
                </div>
            </div>

            <!-- Filter & Sort Section -->
            <div class="controls-section">
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">
                        All <span class="count" id="countAll">0</span>
                    </button>
                    <button class="filter-btn" data-filter="active">
                        Active <span class="count" id="countActive">0</span>
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        Completed <span class="count" id="countCompleted">0</span>
                    </button>
                </div>

                <div class="sort-group">
                    <select id="sortSelect" class="sort-select">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="priority">By Priority</option>
                        <option value="alphabetical">Alphabetical</option>
                    </select>
                </div>

                <div class="action-buttons">
                    <button class="btn-secondary" id="clearCompletedBtn" title="Clear Completed">
                        Clear ✓
                    </button>
                    <button class="btn-secondary" id="exportBtn" title="Export Tasks">
                        Export
                    </button>
                </div>
            </div>

            <!-- Priority Filter -->
            <div class="priority-filter">
                <label class="priority-label">
                    <input type="checkbox" id="filterHigh" class="priority-checkbox" value="high">
                    <span class="priority-badge priority-high">High</span>
                </label>
                <label class="priority-label">
                    <input type="checkbox" id="filterMedium" class="priority-checkbox" value="medium">
                    <span class="priority-badge priority-medium">Medium</span>
                </label>
                <label class="priority-label">
                    <input type="checkbox" id="filterLow" class="priority-checkbox" value="low">
                    <span class="priority-badge priority-low">Low</span>
                </label>
            </div>

            <!-- Stats Dashboard -->
            <div class="stats-dashboard">
                <div class="stat-card">
                    <div class="stat-icon">📋</div>
                    <div class="stat-content">
                        <div class="stat-number" id="statTotal">0</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⚡</div>
                    <div class="stat-content">
                        <div class="stat-number" id="statActive">0</div>
                        <div class="stat-label">Active</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-content">
                        <div class="stat-number" id="statCompleted">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-content">
                        <div class="stat-number" id="statProgress">0%</div>
                        <div class="stat-label">Progress</div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">🎉</div>
                <h2>No tasks yet!</h2>
                <p>Add a new task to get started and stay organized.</p>
            </div>

            <!-- Todo List -->
            <ul class="todo-list" id="todoList"></ul>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 To-Do List App. Built with ❤️</p>
            <p class="footer-tip">💡 Tip: Tasks are automatically saved to your browser</p>
        </footer>
    </div>

    <!-- Search Modal -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Search Tasks</h2>
            <input type="text" id="searchInput" class="search-input" placeholder="Search your tasks...">
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <script src="todo-script.js"></script>
</body>
</html>
